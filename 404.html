<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) - NexMart</title>
  <link rel="stylesheet" href="css/style.css">

</head>

  <!-- HEADER -->
  <header class="site-header">

        <a href="index.html" class="brand-logo">

            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>

          Nex<span class="accent">Mart</span>

    </div>

  <!-- 404 CONTENT -->

    <div class="empty-state" style="margin: 5rem auto; border: none;">
      <div class="empty-icon" style="background: var(--color-danger-soft); color: var(--color-danger);">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      </div>
      <h1 class="empty-title" style="font-size: 2.5rem;">404 - Page Not Found</h1>
      <p class="empty-text">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="index.html" class="btn btn-primary btn-lg">Return to Homepage</a>
        <a href="products.html" class="btn btn-outline btn-lg">Browse Products</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 NexMart Marketplace Inc. All rights reserved.</div>
        <div>Designed with precision & performance in India 🇮🇳</div>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
</body>
</html>

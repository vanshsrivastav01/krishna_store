<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - NexMart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .main-image-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }
    .main-image-frame img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transition: transform 0.1s ease-out;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="main-header">
      <div class="container header-wrapper">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          </div>
          Nex<span class="accent">Mart</span>
        </a>

        <div class="header-search">
          <div class="search-input-group">
            <input type="text" id="header-search-input" class="search-input" placeholder="Search for products, brands and categories..." autocomplete="off">
            <button class="btn-search" aria-label="Search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
          </div>
          <div id="search-suggestions" class="search-suggestions-popup"></div>
        </div>

        <div class="header-actions">
          <a href="account.html" class="header-action-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Account</span>
          </a>
          <a href="wishlist.html" class="header-action-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <span>Wishlist</span>
            <span class="badge wishlist-count-badge" style="display: none;">0</span>
          </a>
          <a href="cart.html" class="header-action-btn cart-btn-desktop">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span>Cart</span>
            <span class="badge cart-count-badge" style="display: none;">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="container" style="margin-top: 2rem;">
    
    <!-- PRODUCT DETAIL INNER WRAPPER -->
    <div id="product-detail-container">
      <!-- Populated dynamically by js/product-detail.js -->
    </div>

    <!-- RELATED PRODUCTS SECTION -->
    <section style="margin-bottom: 4rem;">
      <div class="section-header">
        <div>
          <h2 class="section-title">Similar Products You Might Like</h2>
          <p class="section-subtitle">Based on your current product category</p>
        </div>
      </div>
      <div id="related-products-grid" class="products-grid">
        <!-- Populated dynamically -->
      </div>
    </section>

  </main>

  <!-- FOOTER & MOBILE NAV -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 NexMart Marketplace Inc. All rights reserved.</div>
        <div>Designed with precision & performance in India 🇮🇳</div>
      </div>
    </div>
  </footer>

  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Home</span></a>
    <a href="products.html" class="mobile-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Search</span></a>
    <a href="wishlist.html" class="mobile-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Wishlist</span></a>
    <a href="cart.html" class="mobile-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span>Cart</span></a>
    <a href="account.html" class="mobile-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - NexMart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 3.5rem auto 5rem auto;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--color-border);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 1.1rem;
      font-weight: 700;
      font-size: 1rem;
      text-align: center;
      color: var(--color-text-muted);
      cursor: pointer;
      background: var(--color-bg);
      transition: all var(--transition-fast);
    }
    .auth-tab-btn.active {
      background: var(--color-surface);
      color: var(--color-primary);
      border-bottom: 3px solid var(--color-primary);
    }
    .auth-body {
      padding: 2rem;
    }
    .password-input-wrap {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="main-header">
      <div class="container header-wrapper">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          </div>
          Nex<span class="accent">Mart</span>
        </a>
      </div>
    </div>
  </header>

  <!-- AUTH MAIN CONTENT -->
  <main class="container">
    <div class="auth-container">
      <div class="auth-tabs">
        <div id="tab-btn-login" class="auth-tab-btn active">Sign In</div>
        <div id="tab-btn-signup" class="auth-tab-btn">Create Account</div>
      </div>

      <div class="auth-body">
        <!-- LOGIN FORM -->
        <form id="login-form" onsubmit="handleLoginSubmit(event)">
          <div id="login-error-msg" style="color: var(--color-danger); font-size: 0.8125rem; font-weight: 700; margin-bottom: 1rem;"></div>

          <div class="form-group">
            <label class="form-label">Email or Phone Number</label>
            <input type="text" id="login-email" class="form-input" placeholder="rahul.sharma@example.com" value="rahul.sharma@example.com" required>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <label class="form-label" style="margin: 0;">Password</label>
              <a href="#" style="font-size: 0.75rem; color: var(--color-primary); font-weight: 600;">Forgot password?</a>
            </div>
            <div class="password-input-wrap">
              <input type="password" id="login-password" class="form-input" placeholder="••••••••" value="password123" required>
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; font-size: 0.8125rem; color: var(--color-text-muted);">
            <input type="checkbox" id="remember-me" checked>
            <label for="remember-me">Keep me signed in on this device</label>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Sign In</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signup-form" style="display: none;" onsubmit="handleSignupSubmit(event)">
          <div id="signup-error-msg" style="color: var(--color-danger); font-size: 0.8125rem; font-weight: 700; margin-bottom: 1rem;"></div>

          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="signup-name" class="form-input" placeholder="Rahul Sharma" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="signup-email" class="form-input" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Mobile Number</label>
            <input type="tel" id="signup-phone" class="form-input" placeholder="+91 98765 43210">
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="signup-password" class="form-input" placeholder="Min 6 characters" required>
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('signup-password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="signup-confirm-password" class="form-input" placeholder="Repeat password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Create Account</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 NexMart Marketplace Inc. All rights reserved.</div>
        <div>Designed with precision & performance in India 🇮🇳</div>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
